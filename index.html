<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X3r0Day OS 95</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- DESKTOP ICONS -->
    <div class="desktop" id="desktop">
        <div class="icon-item" ondblclick="openApp('win-main')">
            <span class="emoji-icon">📁</span>
            <span class="label">My Arsenal</span>
        </div>
        <div class="icon-item" ondblclick="alert('Recycle Bin is empty.')">
            <span class="emoji-icon">🗑️</span>
            <span class="label">Recycle Bin</span>
        </div>
        <div class="icon-item" ondblclick="window.open('https://github.com/X3r0Day', '_blank')">
            <span class="emoji-icon">🌐</span>
            <span class="label">GitHub</span>
        </div>
    </div>

    <!-- MAIN FOLDER WINDOW -->
    <div class="window outset" id="win-main">
        <div class="title-bar" onmousedown="dragWindow(event, 'win-main')">
            <div class="title-text"><span style="font-size:16px;">📁</span> C:\X3r0Day\Arsenal</div>
            <div class="title-controls">
                <button class="btn-ctrl" onclick="minimizeApp('win-main')">_</button>
                <button class="btn-ctrl" onclick="maximize('win-main', this)">◻</button>
                <button class="btn-ctrl" onclick="closeApp('win-main')">X</button>
            </div>
        </div>
        <div class="menu-bar">
            <span>File</span><span>Edit</span><span>View</span><span>Help</span>
        </div>
        <div class="window-content inset">
            
            <div class="icon-item app-icon" data-tool="camsnipe">
                <span class="emoji-icon">👁️</span>
                <span class="label">CamSnipe</span>
            </div>
            
            <div class="icon-item app-icon" data-tool="webshame">
                <span class="emoji-icon">🔑</span>
                <span class="label">WebShame</span>
            </div>

            <div class="icon-item app-icon" data-tool="sniffer">
                <span class="emoji-icon">🕷️</span>
                <span class="label">API Sniffer</span>
            </div>

            <div class="icon-item app-icon" data-tool="hashlock">
                <span class="emoji-icon">🔐</span>
                <span class="label">HashLock</span>
            </div>

            <div class="icon-item app-icon" data-tool="specter">
                <span class="emoji-icon">⚡</span>
                <span class="label">Specter</span>
            </div>

            <div class="icon-item app-icon" data-tool="infodisc">
                <span class="emoji-icon">🗄️</span>
                <span class="label">InfoDisc</span>
            </div>

        </div>
    </div>

    <!-- DETAILS PROGRAM WINDOW -->
    <div class="window outset" id="win-details">
        <div class="title-bar" onmousedown="dragWindow(event, 'win-details')">
            <div class="title-text"><span id="det-icon" style="font-size:16px;">⚙️</span> <span id="det-title-bar">Program.exe</span></div>
            <div class="title-controls">
                <button class="btn-ctrl" onclick="minimizeApp('win-details')">_</button>
                <button class="btn-ctrl" onclick="maximize('win-details', this)">◻</button>
                <button class="btn-ctrl" onclick="closeApp('win-details')">X</button>
            </div>
        </div>
        <div class="menu-bar">
            <span>File</span><span>Options</span><span>Help</span>
        </div>
        <div class="window-content inset" id="det-content">
            <!-- Content injected via JS -->
        </div>
    </div>

    <!-- TASKBAR -->
    <div class="taskbar outset">
        <button class="start-btn btn-outset" onclick="alert('X3r0Day OS v95. Operating normally.')">
            <span style="font-size:18px;">🪟</span> <span style="font-style:italic; padding-right:5px;">Start</span>
        </button>
        <div class="divider"></div>
        <div class="task-tabs" id="task-tabs">
            <div class="task-tab outset active" id="tab-win-main" onclick="toggleApp('win-main')">
                <span style="font-size:14px;">📁</span> Arsenal
            </div>
            <div class="task-tab outset active" id="tab-win-details" style="display:none;" onclick="toggleApp('win-details')">
                <span style="font-size:14px;" id="tab-det-icon">⚙️</span> <span id="tab-det-title">Program.exe</span>
            </div>
        </div>
        <div class="tray inset" id="clock">
            12:00 PM
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
